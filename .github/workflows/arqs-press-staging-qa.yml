name: ARQS Press Staging QA

on:
  push:
    branches:
      - staging/arqs-press-storefront-batch-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storefront-runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out staging branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run fail-closed storefront runtime QA
        run: node scripts/arqs-press-staging-qa.cjs
